<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1RM 자동 무게 계산기</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 10px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 4px;
    }

    .description {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f172a;
      padding-bottom: 8px;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: #1e293b;
      color: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #2563eb;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .card {
      background: #111827;
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 10px;
      border: 1px solid #1f2937;
    }

    .section-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .exercise-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    label {
      display: block;
      margin-bottom: 3px;
      font-size: 12px;
      color: #cbd5e1;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #334155;
      background: #020617;
      color: white;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 14px;
    }

    input,
    select {
      margin-bottom: 6px;
    }

    textarea {
      min-height: 160px;
      line-height: 1.6;
      resize: vertical;
    }

    .calculate-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      margin-top: 8px;
      cursor: pointer;
    }

    .output {
      background: #020617;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
    }

    .output-line {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      line-height: 1.5;
    }
    .output-line:last-child {
      border-bottom: none;
    }

    .weight-highlight {
      color: #34d399;
      font-weight: 800;
    }

    .wl-move-name {
      font-size: 12px;
      font-weight: 700;
      color: #94a3b8;
      padding: 6px 0 2px;
    }

    .wl-set-line {
      font-size: 14px;
      color: #34d399;
      font-weight: 700;
      padding: 1px 0 1px 8px;
    }
    .wl-set-line span {
      color: #64748b;
      font-weight: 400;
    }
    .set-num {
      color: #f8fafc !important;
      font-weight: 400 !important;
    }

    .small-note {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .unit-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .unit-row select {
      width: 100px;
      margin-bottom: 0;
    }

    .accordion-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e293b;
      border: none;
      color: white;
      padding: 11px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .accordion-content {
      overflow: hidden;
      max-height: 1000px;
      transition: max-height 0.3s ease;
    }

    .accordion-content.collapsed {
      max-height: 0;
      margin-bottom: 0;
    }

    .accordion-icon {
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🏋️ 1RM 자동 무게 계산기</h1>

    <p class="description">
      WOD 또는 역도 프로그램을 붙여넣으면 퍼센트를 자동 계산해서 kg/lb로 표시합니다.
    </p>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab(event, 'crossfit')">
        CrossFit
      </button>

      <button class="tab-btn" onclick="switchTab(event, 'weightlifting')">
        Weightlifting
      </button>
    </div>

    <!-- CROSSFIT -->
    <div id="crossfit" class="tab-content active">
      <div class="card">
        <button class="accordion-header" onclick="toggleAccordion('cf-accordion', 'cf-icon')">
          <span>1RM 입력</span>
          <span id="cf-icon" class="accordion-icon">▶</span>
        </button>

        <div id="cf-accordion" class="accordion-content collapsed">
          <div class="unit-row">
            <label style="margin:0">단위</label>
            <select id="cf-unit">
              <option value="lb" selected>LB</option>
              <option value="kg">KG</option>
            </select>
          </div>

          <div class="exercise-grid">
          <div>
            <label>Clean</label>
            <input type="number" id="cf-clean" value="135" />
          </div>

          <div>
            <label>Jerk</label>
            <input type="number" id="cf-jerk" value="115" />
          </div>

          <div>
            <label>Snatch</label>
            <input type="number" id="cf-snatch" value="100" />
          </div>

          <div>
            <label>Press</label>
            <input type="number" id="cf-press" value="110" />
          </div>

          <div>
            <label>Front Squat</label>
            <input type="number" id="cf-frontsquat" value="145" />
          </div>

          <div>
            <label>Back Squat</label>
            <input type="number" id="cf-backsquat" value="175" />
          </div>

          <div>
            <label>Deadlift</label>
            <input type="number" id="cf-deadlift" value="230" />
          </div>
        </div>

        </div>
      </div>

      <div class="card">
        <div class="section-title">WOD 입력</div>

        <textarea id="crossfit-input">Every 2 minutes x6

1 Power Clean
2 Push Jerks

Set 1-2 @ 75%
Set 3-4 @ 80%
Set 5-6 @ 85%</textarea>

        <button class="calculate-btn" onclick="calculateCrossfit()">
          계산하기
        </button>
      </div>

      <div class="card">
        <div class="section-title">결과</div>
        <div id="crossfit-output" class="output"></div>
      </div>
    </div>

    <!-- WEIGHTLIFTING -->
    <div id="weightlifting" class="tab-content">
      <div class="card">
        <button class="accordion-header" onclick="toggleAccordion('wl-accordion', 'wl-icon')">
          <span>1RM 입력</span>
          <span id="wl-icon" class="accordion-icon">▶</span>
        </button>

        <div id="wl-accordion" class="accordion-content collapsed">
          <div class="unit-row">
            <label style="margin:0">단위</label>
            <select id="wl-unit">
              <option value="kg" selected>KG</option>
              <option value="lb">LB</option>
            </select>
          </div>

          <div class="exercise-grid">
          <div>
            <label>Clean</label>
            <input type="number" id="wl-clean" value="120" />
          </div>

          <div>
            <label>Jerk</label>
            <input type="number" id="wl-jerk" value="140" />
          </div>

          <div>
            <label>Snatch</label>
            <input type="number" id="wl-snatch" value="100" />
          </div>

          <div>
            <label>Press</label>
            <input type="number" id="wl-press" value="75" />
          </div>

          <div>
            <label>Front Squat</label>
            <input type="number" id="wl-frontsquat" value="150" />
          </div>

          <div>
            <label>Back Squat</label>
            <input type="number" id="wl-backsquat" value="170" />
          </div>

          <div>
            <label>Deadlift</label>
            <input type="number" id="wl-deadlift" value="210" />
          </div>
        </div>

        </div>
      </div>

      <div class="card">
        <div class="section-title">프로그램 입력</div>

        <textarea id="weightlifting-input">sots press 5x3

hang power clean 65% 3x2, 70% 3x2

(slow d.l) clean 75% 3x2, 80% 2x2

clean 80% 2x1, 85% 1x3

hsoc 90~100% 3x3

push jerk 75% 3x3</textarea>

        <button class="calculate-btn" onclick="calculateWeightlifting()">
          계산하기
        </button>
      </div>

      <div class="card">
        <div class="section-title">결과</div>
        <div id="weightlifting-output" class="output"></div>
      </div>
    </div>
  </div>

  <script>
    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);

      content.classList.toggle('collapsed');

      if (content.classList.contains('collapsed')) {
        icon.textContent = '▶';
      } else {
        icon.textContent = '▼';
      }
    }

    function syncCrossfitToWeightlifting() {
      const cfUnit = document.getElementById('cf-unit').value;

      const mappings = [
        ['clean', 'clean'],
        ['jerk', 'jerk'],
        ['snatch', 'snatch'],
        ['press', 'press'],
        ['frontsquat', 'frontsquat'],
        ['backsquat', 'backsquat'],
        ['deadlift', 'deadlift']
      ];

      mappings.forEach(([cfKey, wlKey]) => {
        const cfValue = parseFloat(document.getElementById(`cf-${cfKey}`).value) || 0;

        let kgValue = cfValue;

        if (cfUnit === 'lb') {
          kgValue = cfValue / 2.20462;
        }

        document.getElementById(`wl-${wlKey}`).value = Math.round(kgValue);
      });
    }

    function switchTab(event, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.remove('active');
      });

      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });

      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');

      if (tabId === 'weightlifting') {
        syncCrossfitToWeightlifting();
      }
    }

    function convertToKg(value, unit) {
      if (unit === 'lb') {
        return value / 2.20462;
      }

      return value;
    }

    function roundWeight(value) {
      return Math.round(value);
    }

    function kgToLb(kg) {
      return Math.round(kg * 2.20462);
    }

    function getExerciseMax(exercise, maxes) {
      const lower = exercise.toLowerCase();

      // DEADLIFT
      if (
        lower.includes('deadlift') ||
        lower.includes('dead lift') ||
        lower.includes('d.l')
      ) {
        return maxes.deadlift;
      }

      // FRONT SQUAT
      if (
	lower.includes('front squat')
	) {
        return maxes.frontSquat;
      }

      // SQUAT
      if (
        lower.includes('back squat')
      ) {
        return maxes.backSquat;
      }

      // CLEAN
      if (
        lower.includes('power clean') ||
        lower.includes('hang power clean') ||
        lower.includes('(slow d.l) clean') ||
        lower.includes('c. pull up') ||
        lower.includes('clean')
      ) {
        return maxes.clean;
      }

      // JERK
      if (
        lower.includes('push jerk') ||
        lower.includes('split jerk') ||
        lower.includes('hsoc') ||
        lower.includes('jerk')
      ) {
        return maxes.jerk;
      }

      // PRESS
      if (
        lower.includes('strict press') ||
        lower.includes('push press') ||
        lower.includes('press')
      ) {
        return maxes.press;
      }

      // SNATCH
      if (
        lower.includes('snatch') ||
        lower.includes('s. pull up') ||
        lower.includes('s. balance & ohs') ||
        lower.includes('s. balance') ||
        lower.includes('ohs')
      ) {
        return maxes.snatch;
      }

      return maxes.clean;
    }

    function calculateWeight(percent, maxWeight) {
      const kg = roundWeight(maxWeight * (percent / 100));
      const lb = kgToLb(kg);

      return `${kg}kg (${lb}lb)`;
    }

    function renderOutput(elementId, text) {
      const html = text
        .split('\n')
        .map(line => {
          const highlighted = line.replace(
            /(\d+kg \(\d+lb\))/g,
            '<span class="weight-highlight">$1</span>'
          );

          return `<div class="output-line">${highlighted || '&nbsp;'}</div>`;
        })
        .join('');

      document.getElementById(elementId).innerHTML = html;
    }

    function calculateCrossfit() {
      const unit = document.getElementById('cf-unit').value;

      const maxes = {
        clean: convertToKg(parseFloat(document.getElementById('cf-clean').value) || 0, unit),
        jerk: convertToKg(parseFloat(document.getElementById('cf-jerk').value) || 0, unit),
        snatch: convertToKg(parseFloat(document.getElementById('cf-snatch').value) || 0, unit),
        press: convertToKg(parseFloat(document.getElementById('cf-press').value) || 0, unit),
        frontSquat: convertToKg(parseFloat(document.getElementById('cf-frontsquat').value) || 0, unit),
        backSquat: convertToKg(parseFloat(document.getElementById('cf-backsquat').value) || 0, unit),
        deadlift: convertToKg(parseFloat(document.getElementById('cf-deadlift').value) || 0, unit)
      };

      const input = document.getElementById('crossfit-input').value;
      const lines = input.split('\n');

      let detectedMax = maxes.clean;

      for (const line of lines) {
        const current = getExerciseMax(line, maxes);

        if (current) {
          detectedMax = current;
          break;
        }
      }

      const output = input.replace(/(\d+(?:\.\d+)?)\s*%/g, (match, percent) => {
        return calculateWeight(parseFloat(percent), detectedMax);
      });

      renderOutput('crossfit-output', output);
    }

    function calculateWeightlifting() {
      const unit = document.getElementById('wl-unit').value;

      const maxes = {
        clean: convertToKg(parseFloat(document.getElementById('wl-clean').value) || 0, unit),
        jerk: convertToKg(parseFloat(document.getElementById('wl-jerk').value) || 0, unit),
        snatch: convertToKg(parseFloat(document.getElementById('wl-snatch').value) || 0, unit),
        press: convertToKg(parseFloat(document.getElementById('wl-press').value) || 0, unit),
        frontSquat: convertToKg(parseFloat(document.getElementById('wl-frontsquat').value) || 0, unit),
        backSquat: convertToKg(parseFloat(document.getElementById('wl-backsquat').value) || 0, unit),
        deadlift: convertToKg(parseFloat(document.getElementById('wl-deadlift').value) || 0, unit)
      };

      const rawInput = document.getElementById('weightlifting-input').value;
      const outputEl = document.getElementById('weightlifting-output');
      let html = '';

      // 종목 키워드 앞에 자동 줄바꿈 삽입
      const moveKeywords = [
        'back press', 'sots press', 'm. press', 'push press', 'press',
        's\.pull up', 'c\.pull up', 'low hang s\. pull up', 's\. pull up',
        'power snatch', 'squat snatch', 'hang power snatch', 'hang snatch',
        '\(slow d\.l\) snatch', '\(slow d\.l\) s\. pull up', '\(slow d\.l\) c\. pull up', '\(slow d\.l\) clean',
        'snatch',
        'power clean', 'squat clean', 'hang power clean', 'hang clean',
        '\(slow d\.l\) c\.d\.l', 'c\.d\.l', 'hsoc',
        'clean',
        's\. balance & ohs', 's\.balance', 'ohs',
        'back squat', 'front squat',
        'push jerk', 'split jerk', 'jerk',
        's\.d\.l', 'c\.d\.l', 'deadlift',
        '월\b', '화\b', '수\b', '목\b', '금\b', '토\b', '일\b'
      ];
      // 종목명 앞에 자동 줄바꿈 삽입
      // 긴 패턴(복합종목)을 먼저 나열해야 짧은 패턴이 중간에 끼어들지 않음
      const allMoves = [
        // (slow d.l) 복합 종목 — 반드시 먼저
        '\\(slow d\\.l\\)\\s*s\\.\\s*pull\\s*up',
        '\\(slow d\\.l\\)\\s*c\\.\\s*pull\\s*up',
        '\\(slow d\\.l\\)\\s*snatch',
        '\\(slow d\\.l\\)\\s*clean',
        '\\(slow d\\.l\\)\\s*c\\.d\\.l',
        '\\(slow d\\.l\\)\\s*s\\.d\\.l',
        // & 복합 종목
        's\\.pull\\s*up\\s*&\\s*half\\s*snatch',
        'c\\.pull\\s*up\\s*&\\s*half\\s*clean',
        's\\.\\s*balance\\s*&\\s*ohs',
        // low hang
        'low\\s*hang\\s*s\\.\\s*pull\\s*up',
        'low\\s*hang\\s*power\\s*snatch',
        'low\\s*hang\\s*snatch',
        // hang power
        'hang\\s*power\\s*snatch',
        'hang\\s*power\\s*clean',
        'hang\\s*snatch',
        'hang\\s*clean',
        // power / squat
        'power\\s*snatch',
        'squat\\s*snatch',
        'power\\s*clean',
        'squat\\s*clean',
        // pull up
        's\\.\\s*pull\\s*up',
        'c\\.\\s*pull\\s*up',
        // press
        'back\\s*press',
        'sots\\s*press',
        'm\\.\\s*press',
        'push\\s*press',
        // squat
        'back\\s*squat',
        'front\\s*squat',
        // jerk
        'push\\s*jerk',
        'split\\s*jerk',
        // deadlift
        's\\.d\\.l',
        'c\\.d\\.l',
        'deadlift',
        // single words — 반드시 마지막
        'hsoc',
        'snatch',
        'clean',
        'jerk',
        'press',
        'ohs',
        // 요일
        '(?:월|화|수|목|금|토|일)(?=\\b|\\s|$)'
      ];
      const moveRegex = new RegExp('(?<![&\\w()])(' + allMoves.join('|') + ')', 'gi');
      const input = rawInput
        .replace(moveRegex, '\n$1')
        .replace(/^\n/, '');

      input.split('\n').forEach(line => {
        const trimmed = line.trim();
        if (!trimmed) { html += '<div class="output-line">&nbsp;</div>'; return; }

        const maxWeight = getExerciseMax(line, maxes);

        // 퍼센트가 없는 줄 → 회색 종목명 스타일로 통일
        if (!/%/.test(trimmed)) {
          html += `<div class="output-line wl-move-name">${trimmed}</div>`;
          return;
        }

        // 종목명 추출: 첫 숫자 앞까지
        const moveMatch = trimmed.match(/^(.*?)(?=\d+(?:\.\d+)?\s*(?:~\d+)?\s*%)/);
        const moveName = moveMatch ? moveMatch[1].trim().replace(/,\s*$/, '') : '';

        // 각 퍼센트 세그먼트를 콤마로 분리
        const segments = trimmed.split(',');
        let setLines = [];

        segments.forEach((seg, segIdx) => {
          seg = seg.trim();
          // 첫 번째 세그먼트에서 종목명 제거
          if (segIdx === 0 && moveName) {
            seg = seg.replace(moveName, '').trim();
          }

          // 범위 퍼센트: 90~100%
          seg = seg.replace(/(\d+)\s*~\s*(\d+)%/g, (m, s, e) => {
            const kg1 = roundWeight(maxWeight * parseFloat(s) / 100);
            const kg2 = roundWeight(maxWeight * parseFloat(e) / 100);
            const lb1 = kgToLb(kg1);
            const lb2 = kgToLb(kg2);
            return `${kg1}~${kg2}kg (${lb1}~${lb2}lb)`;
          });

          // 단일 퍼센트: 65% 3x2
          seg = seg.replace(/(\d+(?:\.\d+)?)\s*%/g, (m, p) => {
            return calculateWeight(parseFloat(p), maxWeight);
          });

          // 퍼센트 치환된 seg 그대로 사용 (세트 정보 이미 포함됨)
          // 세트 패턴(NxN)만 회색 span으로 감싸기
          const segTrimmed = seg.trim();
          const colored = segTrimmed.replace(/(\d+x\d+)/g, '<span class="set-num">$1</span>');
          setLines.push(colored);
        });

        if (moveName) {
          html += `<div class="output-line wl-move-name">${moveName}</div>`;
        }
        html += `<div class="output-line wl-set-line">${setLines.join(', ')}</div>`;
      });

      outputEl.innerHTML = html;
    }

    // TEST CASES
    calculateCrossfit();
    calculateWeightlifting();
  </script>
</body>
</html>
